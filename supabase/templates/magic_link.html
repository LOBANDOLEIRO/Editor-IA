<h2>Entrar no Editor IA</h2>
<p>Seu código de acesso:</p>
<p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
<p>Ou toque no botão abaixo para entrar direto:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/editor">Entrar no Editor IA</a></p>
<p style="color:#666;font-size:12px">Se você não pediu este e-mail, pode ignorar.</p>
